<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .job-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .job-filters select, .job-filters input { flex: 1; min-width: 140px; padding:px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; background: #fff; }
  .job-filters input { flex: 2; }
  .job-card { background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0.06); border-left: 4px solid #2d6a4f; }
  .job-card h3 { margin: 0 4px; font-size: 17px; color: #1b4332; }
  .job-card .employer { font-size: 14px; color: #555; margin-bottom: 6px; }
  .job-card .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: #666; margin-bottom: 8px; }
  .job-card .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .job-card .summary { font-size: 14px; color: #444; line-height: 1.5; margin-bottom: 10px; }
  .job-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .job-card .actions a { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn-apply { background: #2d6a4f; color: #fff; }
  .btn-apply:hover { background: #1b4332; }
  .btn-download { background: #e9c46a; color: #333; }
  .btn-download:hover { background: #d4a373; }
  .badge { display: inline-block; padding 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-ft { background: #d8f3dc; color: #1b4332; }
  .badge-pt { background: #fff3cd; color: #856404; }
  .badge-seasonal { background: #cfe2ff; color: #0a58ca; }
  .badge-closing { background: #f8d7da; color: #842029; }
  .no-jobs { text-align: center; padding: 40px 20px; color: #888; }
  .no-jobs svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="back-btn">←</a>
  <span class="topbar-title">Jobs &amp; Opportunities</span>
  <div></div>
</header>
<div class="container">
  <div class="hero-band">
    <div class="hero-top">
      <div>
        <h2>Opportunities for Hoopa Valley</h2>
        <p>Discover local and tribal job openings, career resources, and application links in one place.</p>
      </div>
    </div>
  </div>
  <div class="job-filters">
    <select id="filter-type">
      <option value="">All Types</option>
      <option value="Full-time">Full-time</option>
      <option value="Part-time">Part-time</option>
      <option value="Seasonal">Seasonal</option>
    </select>
    <select id="filter-category">
      <option value="">All Categories</option>
      <option value="Public Safety">Public Safety</option>
      <option value="Natural Resources">Natural Resources</option>
      <option value="Healthcare">Healthcare</option>
      <option value="Education">Education</option>
      <option value="Administration">Administration</option>
      <option value="Public Works">Public Works</option>
      <option value="Services">Services</option>
    </select>
    <input type="text" id="filter-search" placeholder="Search jobs…">
  </div>
  <div id="jobs-list" class="portal-stack"></div>
</div>
<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-item" href="directory.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span class="nav-label">Directory</span>
  </a>
  <a class="nav-item nav-sell" href="jobs.html">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M7 7V5h10v2"/><path d="M6 7l1 12h10l1-12"/></svg>
    <span class="nav-label">Jobs</span>
  </a>
  <a class="nav-item" href="admin.html">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V7l7-4z"/></svg>
    <span class="nav-label">Admin</span>
  </a>
  <a class="nav-item" href="profile.html">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4 4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="nav-label">Profile</span>
  </a>
</nav>

<script src="js/supabase.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
