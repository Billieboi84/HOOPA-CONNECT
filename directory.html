<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #map-container {
    width: 100%;
    height: 300px;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  #map-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .dir-filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .dir-filter-bar select,
  .dir-filter-bar input {
    flex: 1;
    min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .dir-filter-bar select:focus,
  .dir-filter-bar input:focus {
    border-color: var(--accent);
  }
  .dir-map-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .dir-map-btn:hover {
    background: var(--accent-glow);
  }
  .dir-entry-map {
    width: 100%;
    height: 180px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    margin-top: 12px;
    border: 1px solid var(--border);
  }
  .dir-entry-map iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .dir-category-tag {
    display: inline-block;
    background: var(--accent-2-dim);
    color: var(--accent-2);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    margin-top: 6px;
  }
  .dir-description {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="back-btn">←</a>
  <span class="topbar-title">Business Hub</span>
  <div></div>
</header>
<div class="container">
  <div class="hero-band">
    <div class="hero-top">
      <div>
        <h2>Hoopa Valley Connections</h2>
        <p>Find trusted local businesses, tribal entities, and vital contacts in one easy-to-use directory.</p>
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="dir-filter-bar">
    <select id="dir-filter-kind">
      <option value="all">All Types</option>
      <option value="Business">Businesses</option>
      <option value="Tribal Entity">Tribal Entities</option>
    </select>
    <select id="dir-filter-category">
      <option value="all">All Categories</option>
      <option value="Government">Government</option>
      <option value="Health">Health</option>
      <option value="Education">Education</option>
      <option value="Retail">Retail</option>
      <option value="Services">Services</option>
      <option value="Culture">Culture</option>
      <option value="Recreation">Recreation</option>
    </select>
    <input type="text" id="dir-filter-search" placeholder="Search by name...">
  </div>

  <!-- Map overview -->
  <div id="map-container">
    <iframe
      src="https://www.google.com/maps/embed/v1/place?key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZNTgao-7Ltq8I&q=Hoopa+California&center=41.0526,-123.6749&zoom=12"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>

  <div id="directory-list" class="portal-stack"></div>
</div>
<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-item" href="directory.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span class="nav-label">Business Hub</span>
  </a>
  <a class="nav-item nav-sell" href="jobs.html">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M7 7V5h10v2"/><path d="M6 7l1 12h10l1-12"/></svg>
    <span class="nav-label">Jobs</span>
  </a>
  <a class="nav-item" href="admin.html">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V7l7-4z"/></svg>
    <span class="nav-label">Admin</span>
  </a>
  <a class="nav-item" href="profile.html">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="nav-label">Profile</span>
  </a>
</nav>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
