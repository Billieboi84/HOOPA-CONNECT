<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Profile — Hoopa-Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</head>
<body>

<header class="topbar">
  <a href="javascript:history.back()" class="back-btn">←</a>
  <span class="topbar-title" id="seller-page-title">Seller Profile</span>
  <div></div>
</header>

<div class="container">

  <div class="profile-card" id="seller-profile-card">
    <div class="skeleton" style="width:80px;height:80px;border-radius:50%;margin:0 auto 14px;"></div>
    <div class="skeleton" style="height:24px;width:60%;margin:0 auto 8px;"></div>
    <div class="skeleton" style="height:16px;width:80%;margin:0 auto;"></div>
  </div>

  <div class="form-card">
    <h2>Seller Listings</h2>
  </div>

  <div class="grid" id="seller-grid">
    <p class="grid-empty">Loading listings...</p>
  </div>

</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-item" href="search.html">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="nav-label">Search</span>
  </a>
  <a class="nav-item nav-sell" href="create-listing.html">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span class="nav-label">Sell</span>
  </a>
  <a class="nav-item" href="categories.html">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span class="nav-label">Browse</span>
  </a>
  <a class="nav-item" href="profile.html">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="nav-label">Profile</span>
  </a>
</nav>

<script>
// Sell button always visible

async function loadSeller() {
  const params = new URLSearchParams(location.search);
  const sellerId = params.get('id');
  const profileCard = document.getElementById('seller-profile-card');
  const grid = document.getElementById('seller-grid');

  if (!sellerId) {
    profileCard.innerHTML = `<p class="text-muted" style="text-align:center;padding:20px;">No seller specified.</p>`;
    grid.innerHTML = '';
    return;
  }

  // Load seller profile
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('username, full_name, bio, avatar_url')
    .eq('id', sellerId)
    .single();

  const name = profile?.full_name || profile?.username || 'Community Seller';
  const handle = profile?.username ? `@${profile.username}` : '';
  const bio = profile?.bio || 'No bio yet.';
  const avatar = profile?.avatar_url || '';
  const shortName = name.split(' ')[0] || 'Seller';

  document.getElementById('seller-page-title').textContent = shortName;

  profileCard.innerHTML = `
    <img class="avatar" src="${avatar || 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 80 80\'><rect width=\'80\' height=\'80\' fill=\'%230f172a\'/><text y=\'52\' x=\'22\' font-size=\'40\'>👤</text></svg>'}" alt="${esc(name)}">
    <h2>${esc(name)}</h2>
    <p class="handle">${handle || 'Hoopa-Connect member'}</p>
    <p class="bio">${esc(bio)}</p>
  `;

  // Load seller listings
  const { data: listings, error } = await supabaseClient
    .from('listings')
    .select('*')
    .eq('user_id', sellerId)
    .order('id', { ascending: false });

  if (error || !listings || listings.length === 0) {
    grid.innerHTML = `<p class="grid-empty">This seller hasn't posted any listings yet.</p>`;
    return;
  }

  grid.innerHTML = '';
  listings.forEach(function(item) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = 'listing.html?id=' + item.id;
    a.innerHTML =
      '<img src="' + esc(item.image_url) + '" loading="lazy" alt="' + esc(item.title) + '">' +
      '<div class="card-body"><h3>' + esc(item.title) + '</h3>' +
      '<span class="cat-tag">' + esc(item.category) + '</span>' +
      '<div class="price">$' + esc(item.price) + '</div></div>';
    grid.appendChild(a);
  });
}

loadSeller();
</script>
</body>
</html>
